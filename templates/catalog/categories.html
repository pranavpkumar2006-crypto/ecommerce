{% extends 'base.html' %}
{% block content %}<div class="container py-5"><h1>Categories</h1><div class="row g-3 mt-2">{% for category in categories %}<div class="col-6 col-md-3"><a class="category-tile" href="{% url 'shop' %}?category={{ category.slug }}"><span>{{ category.name }}</span><small>Shop now</small></a></div>{% endfor %}</div></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>Dashboard</h1><div class="account-grid"><a href="{% url 'orders' %}">Orders</a><a href="{% url 'wishlist' %}">Wishlist</a><a href="{% url 'profile' %}">Profile</a><a href="{% url 'addresses' %}">Addresses</a></div><h3 class="mt-5">Recent orders</h3>{% for order in orders %}<a class="order-row" href="{% url 'order_detail' order.order_number %}"><span>{{ order.order_number }}</span><span>{{ order.status }}</span><strong>Rs. {{ order.grand_total }}</strong></a>{% empty %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}

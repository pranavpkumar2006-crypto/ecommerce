{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>Checkout</h1>{% if not addresses %}<p>Add an address before checkout.</p><a class="btn btn-dark" href="{% url 'addresses' %}">Add address</a>{% else %}<form method="post" class="row g-4">{% csrf_token %}<div class="col-lg-7"><label>Shipping address</label><select class="form-select mb-3" name="shipping_address">{% for a in addresses %}<option value="{{ a.id }}">{{ a }}</option>{% endfor %}</select><label>Billing address</label><select class="form-select mb-3" name="billing_address">{% for a in addresses %}<option value="{{ a.id }}">{{ a }}</option>{% endfor %}</select><label>Payment method</label><select class="form-select" name="payment_method"><option value="cod">Cash on delivery</option><option value="stripe">Stripe</option><option value="razorpay">Razorpay</option></select></div><aside class="col-lg-5"><div class="summary"><h4>Summary</h4><p>Total <span>Rs. {{ cart.total }}</span></p><button class="btn btn-dark w-100">Place order</button></div></aside></form>{% endif %}</div>{% endblock %}

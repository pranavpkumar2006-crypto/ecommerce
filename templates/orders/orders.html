{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1>Orders</h1>{% for order in orders %}<a class="order-row" href="{% url 'order_detail' order.order_number %}"><span>{{ order.order_number }}</span><span>{{ order.status }}</span><strong>Rs. {{ order.grand_total }}</strong></a>{% empty %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}
